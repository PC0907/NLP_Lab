name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Lightweight deps only: the unit tests cover labelling and data loading,
      # not model inference, so torch/transformers are not needed here.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pydantic python-dotenv pymupdf numpy scipy scikit-learn json-repair pytest
          pip install -e .
      - name: Test
        run: pytest
